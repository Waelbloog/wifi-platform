<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميتا ترون | لوحة تحكم الشبكة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة الرسوم البيانية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, #8b5cf6, #d946ef); border-radius: 10px; }
    </style>
    <script>
        if (!localStorage.getItem('metatron_token')) {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden selection:bg-violet-200">

    <!-- شريط المهام الجانبي -->
    <aside class="w-72 bg-slate-900 text-slate-300 flex flex-col hidden lg:flex transition-all duration-300 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-64 h-64 bg-violet-600/20 rounded-full blur-3xl -z-10"></div>
        <div class="h-20 flex items-center justify-center border-b border-slate-800/50 bg-slate-900/50 backdrop-blur-sm z-10">
            <h1 class="text-3xl font-black text-white tracking-wider">ميتا <span class="text-transparent bg-clip-text bg-gradient-to-l from-violet-400 to-fuchsia-500">ترون</span></h1>
        </div>
        <div class="p-6 z-10">
            <p class="text-xs font-bold text-slate-500 mb-4 uppercase tracking-wider">لوحة شبكتي</p>
            <nav class="space-y-3">
                <a href="#" class="flex items-center gap-3 bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white px-4 py-3 rounded-2xl shadow-lg shadow-violet-900/40 transition-all font-bold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    لوحة القيادة
                </a>
                <button onclick="logout()" class="w-full flex items-center gap-3 text-rose-400 hover:text-white hover:bg-rose-500/20 px-4 py-3 rounded-2xl transition-all mt-10 font-bold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    تسجيل الخروج
                </button>
            </nav>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50 relative">
        <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-violet-50/50 to-transparent pointer-events-none"></div>

        <header class="h-20 bg-white/70 backdrop-blur-xl border-b border-white/50 flex items-center justify-between px-8 z-20 shadow-sm">
            <h2 class="text-2xl font-black text-slate-800">إدارة شبكة <span id="dashboardTitle" class="text-violet-600">...</span></h2>
            <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                <div class="text-left hidden md:block">
                    <p class="text-sm font-bold text-slate-700">المدير العام</p>
                    <p class="text-xs text-emerald-500 font-bold">متصل</p>
                </div>
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 to-fuchsia-500 text-white flex items-center justify-center font-black shadow-md">M</div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 z-10">
            <div class="max-w-6xl mx-auto space-y-6">
                
                <!-- الإحصائيات العلوية -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex items-center gap-4 hover:-translate-y-1 transition-transform">
                        <div class="w-14 h-14 bg-emerald-50 text-emerald-500 rounded-2xl flex items-center justify-center border border-emerald-100"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                        <div>
                            <p class="text-sm font-bold text-slate-400 mb-1">أرباح اليوم</p>
                            <h3 class="text-2xl font-black text-slate-800"><span id="statTodayRev">0</span> <span class="text-sm text-slate-500 font-bold">ر.ي</span></h3>
                        </div>
                    </div>
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex items-center gap-4 hover:-translate-y-1 transition-transform">
                        <div class="w-14 h-14 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center border border-blue-100"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg></div>
                        <div>
                            <p class="text-sm font-bold text-slate-400 mb-1">مبيعات اليوم (كروت)</p>
                            <h3 class="text-2xl font-black text-slate-800"><span id="statTodaySold">0</span> <span class="text-sm text-slate-500 font-bold">كرت</span></h3>
                        </div>
                    </div>
                    <div class="bg-gradient-to-r from-violet-600 to-fuchsia-600 rounded-3xl p-6 shadow-lg shadow-violet-200/50 flex items-center gap-4 hover:-translate-y-1 transition-transform text-white">
                        <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-sm"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg></div>
                        <div>
                            <p class="text-sm font-bold text-violet-100 mb-1">إجمالي الأرباح</p>
                            <h3 class="text-2xl font-black"><span id="statTotalRev">0</span> <span class="text-sm font-bold">ر.ي</span></h3>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- الرسم البياني -->
                    <div class="lg:col-span-2 bg-white rounded-3xl shadow-sm border border-slate-100 p-6 flex flex-col">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-black text-slate-800 text-lg">مؤشر المبيعات (آخر 7 أيام) 📈</h3>
                        </div>
                        <div class="relative flex-1 w-full min-h-[250px]">
                            <canvas id="salesChart"></canvas>
                        </div>
                    </div>

                    <!-- التنبيهات ورفع الكروت -->
                    <div class="flex flex-col gap-6">
                        <!-- التنبيهات -->
                        <div class="bg-rose-50 rounded-3xl border border-rose-100 p-6">
                            <h3 class="font-black text-rose-600 mb-4 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                تنبيهات المخزون
                            </h3>
                            <ul id="lowStockList" class="space-y-3">
                                <li class="text-sm font-bold text-rose-400">جاري فحص الخزنة...</li>
                            </ul>
                        </div>
                        
                        <!-- صندوق تغذية الخزنة النظيف (ملف + يدوي فقط) -->
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                            <!-- التبويبات -->
                            <div class="flex border-b border-slate-100 bg-slate-50/50">
                                <button onclick="switchTab('tab-file')" id="btn-tab-file" class="flex-1 py-3 text-sm font-black text-violet-600 border-b-2 border-violet-600 transition-colors">📄 ملف (إكسل)</button>
                                <button onclick="switchTab('tab-manual')" id="btn-tab-manual" class="flex-1 py-3 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-colors">✍️ إضافة يدوية</button>
                            </div>

                            <div class="p-6">
                                <!-- التبويب 1: الرفع عبر ملف -->
                                <div id="tab-file" class="text-center group relative block">
                                    <!-- طبقة الرفع (الخلفية) -->
                                    <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept=".csv, .xlsx, .txt" onchange="quickUpload(event)">
                                    
                                    <div class="w-12 h-12 bg-violet-50 text-violet-500 rounded-2xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform relative z-0">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                    </div>
                                    <h4 class="font-black text-slate-800 text-sm mb-2 relative z-0">تغذية الخزنة عبر إكسل</h4>
                                    
                                    <!-- القائمة المنسدلة (طبقة علوية z-20 لتعمل بشكل صحيح) -->
                                    <select id="quickPackageSelectFile" class="w-full text-xs bg-white border-2 border-slate-200 rounded-lg p-2 font-bold focus:outline-none mb-1 relative z-20 cursor-pointer hover:border-violet-400 transition-colors">
                                        <option value="" disabled selected>اختر الباقة...</option>
                                    </select>
                                    
                                    <p id="uploadStatusFile" class="text-[10px] text-slate-400 font-bold mt-2 relative z-0">اختر الباقة ثم انقر أو اسحب الملف هنا</p>
                                </div>

                                <!-- التبويب 2: إضافة يدوية -->
                                <div id="tab-manual" class="hidden">
                                    <h4 class="font-black text-slate-800 text-sm mb-3 text-center">إضافة كرت مفرد</h4>
                                    <select id="quickPackageSelectManual" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 font-bold focus:outline-none mb-3 cursor-pointer">
                                        <option value="" disabled selected>اختر الباقة...</option>
                                    </select>
                                    <div class="flex gap-2 mb-3">
                                        <input type="text" id="manualUser" placeholder="رقم الكرت / اليوزر" class="w-1/2 text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 font-bold focus:border-violet-500">
                                        <input type="text" id="manualPass" placeholder="الباسورد (اختياري)" class="w-1/2 text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 font-bold focus:border-violet-500">
                                    </div>
                                    <button onclick="addManualCard()" id="btnManualAdd" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2 rounded-lg text-sm transition-colors shadow-md">إضافة للخزنة +</button>
                                    <p id="uploadStatusManual" class="text-[10px] text-center font-bold mt-2"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('metatron_token');
        const myNetworkId = localStorage.getItem('network_id');
        const myNetworkName = localStorage.getItem('network_name');
        const myNetworkSlug = localStorage.getItem('network_slug');

        document.getElementById('dashboardTitle').innerText = myNetworkName;

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchDashboardStats();
            await loadQuickPackages();
        });

        // ======================================
        // 1. التبديل بين التبويبات (Tabs Logic)
        // ======================================
        function switchTab(tabId) {
            ['tab-file', 'tab-manual'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById('btn-' + id).classList.remove('text-violet-600', 'border-violet-600', 'font-black');
                document.getElementById('btn-' + id).classList.add('text-slate-400', 'border-transparent', 'font-bold');
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.add('text-violet-600', 'border-violet-600', 'font-black');
            document.getElementById('btn-' + tabId).classList.remove('text-slate-400', 'border-transparent');
        }

        // ======================================
        // 2. جلب البيانات والإحصائيات
        // ======================================
        async function fetchDashboardStats() {
            try {
                const response = await fetch('https://wifi-platform.onrender.com/api/network/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('statTodayRev').innerText = data.today_revenue;
                    document.getElementById('statTodaySold').innerText = data.today_sold;
                    document.getElementById('statTotalRev').innerText = data.total_revenue;

                    const stockList = document.getElementById('lowStockList');
                    stockList.innerHTML = '';
                    if (data.low_stock.length > 0) {
                        data.low_stock.forEach(pkg => {
                            stockList.innerHTML += `
                                <li class="flex justify-between items-center bg-white/50 p-2.5 rounded-xl border border-rose-100">
                                    <span class="text-sm font-bold text-slate-700">${pkg.name}</span>
                                    <span class="text-xs font-black text-rose-600 bg-rose-100 px-2 py-1 rounded-lg">متبقي: ${pkg.available_cards}</span>
                                </li>
                            `;
                        });
                    } else {
                        stockList.innerHTML = '<li class="text-sm font-bold text-emerald-500 bg-emerald-50 p-3 rounded-xl text-center">المخزون ممتاز في جميع الباقات 👍</li>';
                    }

                    renderChart(data.chart_data);
                }
            } catch (error) {
                console.error("Error fetching stats:", error);
            }
        }

        // ======================================
        // 3. الرسم البياني (Chart.js)
        // ======================================
        function renderChart(chartData) {
            const ctx = document.getElementById('salesChart').getContext('2d');
            
            let labels = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
            let dataPoints = [0, 0, 0, 0, 0, 0, 0];

            if (chartData && chartData.length > 0) {
                labels = chartData.map(item => item.day_name.trim());
                dataPoints = chartData.map(item => parseFloat(item.daily_total));
            }

            let gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(139, 92, 246, 0.5)'); 
            gradient.addColorStop(1, 'rgba(139, 92, 246, 0.0)'); 

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'المبيعات (ريال)',
                        data: dataPoints,
                        borderColor: '#8b5cf6',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#8b5cf6',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9', drawBorder: false }, ticks: { font: { family: 'Tajawal', weight: 'bold' }, color: '#94a3b8' } },
                        x: { grid: { display: false, drawBorder: false }, ticks: { font: { family: 'Tajawal', weight: 'bold' }, color: '#64748b' } }
                    }
                }
            });
        }

        // ======================================
        // 4. جلب الباقات والرفع (الإكسل + اليدوي)
        // ======================================
        async function loadQuickPackages() {
            try {
                const res = await fetch(`https://wifi-platform.onrender.com/api/store-packages/${myNetworkSlug}`);
                const data = await res.json();
                if (data.success) {
                    let optionsHTML = '<option value="" disabled selected>اختر الباقة...</option>';
                    data.packages.forEach(pkg => { optionsHTML += `<option value="${pkg.id}">${pkg.name}</option>`; });
                    
                    document.getElementById('quickPackageSelectFile').innerHTML = optionsHTML;
                    document.getElementById('quickPackageSelectManual').innerHTML = optionsHTML;
                }
            } catch (err) {}
        }

        async function quickUpload(e) {
            const file = e.target.files[0];
            const pkgId = document.getElementById('quickPackageSelectFile').value;
            const status = document.getElementById('uploadStatusFile');

            if (!file) return;
            if (!pkgId) { alert('الرجاء اختيار الباقة أولاً من القائمة'); e.target.value = ''; return; }

            status.innerText = 'جاري المعالجة والرفع... ⏳';
            status.className = 'text-[10px] text-violet-500 font-bold mt-2 animate-pulse relative z-0';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('package_id', pkgId);
            formData.append('network_id', myNetworkId);

            try {
                const response = await fetch('https://wifi-platform.onrender.com/api/upload-cards', {
                    method: 'POST', body: formData
                });
                const result = await response.json();
                
                if (result.success) {
                    status.innerText = '✅ تم الرفع بنجاح! تحديث...';
                    status.className = 'text-[10px] text-emerald-500 font-bold mt-2 relative z-0';
                    setTimeout(() => location.reload(), 1500); 
                } else {
                    status.innerText = '❌ خطأ: ' + result.message;
                    status.className = 'text-[10px] text-rose-500 font-bold mt-2 relative z-0';
                }
            } catch (err) {
                status.innerText = '❌ فشل الاتصال بالسيرفر';
                status.className = 'text-[10px] text-rose-500 font-bold mt-2 relative z-0';
            } finally {
                e.target.value = ''; // تصفير الملف
            }
        }

        async function addManualCard() {
            const pkgId = document.getElementById('quickPackageSelectManual').value;
            const username = document.getElementById('manualUser').value;
            const password = document.getElementById('manualPass').value;
            const status = document.getElementById('uploadStatusManual');
            const btn = document.getElementById('btnManualAdd');

            if(!pkgId || !username) { status.innerText = '❌ الرجاء اختيار الباقة وكتابة اليوزر'; status.className = 'text-[10px] text-rose-500 font-bold mt-2 text-center'; return; }

            btn.innerText = 'جاري الإضافة...'; btn.disabled = true;
            try {
                const response = await fetch('https://wifi-platform.onrender.com/api/cards/manual', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ network_id: myNetworkId, package_id: pkgId, username, password })
                });
                const result = await response.json();
                if(result.success) {
                    status.innerText = result.message; status.className = 'text-[10px] text-emerald-500 font-bold mt-2 text-center';
                    document.getElementById('manualUser').value = ''; document.getElementById('manualPass').value = '';
                    setTimeout(() => location.reload(), 1000);
                } else {
                    status.innerText = '❌ خطأ: ' + result.message; status.className = 'text-[10px] text-rose-500 font-bold mt-2 text-center';
                }
            } catch(err) { status.innerText = '❌ فشل الاتصال بالسيرفر'; } finally { btn.innerText = 'إضافة للخزنة +'; btn.disabled = false; }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
