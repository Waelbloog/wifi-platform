<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ميتا ترون | دخول العملاء</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .modal-enter { opacity: 0; transform: scale(0.95) translateY(20px); }
        .modal-active { opacity: 1; transform: scale(1) translateY(0); }
        .form-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <!-- زر تجريبي لفتح النافذة -->
    <button onclick="openAuthModal('register')" class="bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold px-8 py-3 rounded-xl shadow-lg hover:shadow-violet-300 transition-all hover:-translate-y-1">
        تسجيل الدخول / إنشاء حساب للعملاء
    </button>

    <!-- النافذة العائمة الكبرى -->
    <div id="authModal" class="fixed inset-0 z-50 hidden flex-col justify-end sm:justify-center items-center px-4 pb-4 sm:p-0">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeAuthModal()"></div>
        
        <div id="authModalContent" class="modal-enter relative bg-white/95 backdrop-blur-xl w-full max-w-md rounded-[2.5rem] shadow-2xl transition-all duration-300 overflow-hidden border border-white/50">
            
            <div class="absolute top-0 right-0 w-48 h-48 bg-violet-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 w-48 h-48 bg-fuchsia-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <button onclick="closeAuthModal()" class="absolute top-5 left-5 text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 p-2 rounded-full transition-colors z-20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="p-8 pt-10 relative z-10">
                
                <!-- 1. نموذج تسجيل الدخول -->
                <div id="loginFormContainer" class="form-fade-in block">
                    <div class="text-center mb-8">
                        <div class="w-14 h-14 bg-gradient-to-tr from-violet-600 to-fuchsia-500 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-md shadow-violet-200">
                            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                        </div>
                        <h3 class="text-2xl font-black text-slate-800">تسجيل الدخول</h3>
                        <p class="text-sm text-slate-500 font-bold mt-1">مرحباً بعودتك إلى شبكات ميتا ترون</p>
                    </div>

                    <form onsubmit="handleCustomerLogin(event)">
                        <div class="mb-5">
                            <label class="block text-sm font-bold text-slate-600 mb-2">رقم الجوال</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-violet-600 font-black border-r border-slate-200 pr-3 my-2" dir="ltr">+967</div>
                                <input type="tel" id="loginPhone" required placeholder="7XX XXX XXX" class="w-full pl-[4.5rem] pr-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 focus:bg-white text-left dir-ltr text-lg font-black text-slate-700 tracking-widest transition-all" dir="ltr">
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="block text-sm font-bold text-slate-600 mb-2">كلمة المرور</label>
                            <div class="relative">
                                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 focus:bg-white text-left dir-ltr text-lg font-bold text-slate-700 tracking-widest transition-all" dir="ltr">
                                <button type="button" onclick="togglePassword('loginPassword', 'loginEyeIcon')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-violet-600">
                                    <svg id="loginEyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                </button>
                            </div>
                        </div>
                        
                        <div class="flex justify-end mb-6">
                            <a href="#" class="text-xs font-bold text-violet-600 hover:underline">نسيت كلمة المرور؟</a>
                        </div>

                        <button type="submit" id="loginBtn" class="w-full bg-slate-900 text-white font-black text-lg py-4 rounded-2xl shadow-xl hover:bg-slate-800 transition-all hover:-translate-y-0.5">
                            دخول آمن 🚀
                        </button>
                    </form>

                    <div class="mt-6 text-center border-t border-slate-100 pt-5">
                        <p class="text-sm font-bold text-slate-500">مستخدم جديد؟ <button onclick="toggleAuthView('register')" class="text-fuchsia-600 hover:text-fuchsia-700 hover:underline">إنشاء حساب مجاني</button></p>
                    </div>
                </div>

                <!-- 2. نموذج إنشاء حساب -->
                <div id="registerFormContainer" class="form-fade-in hidden">
                    <div class="text-center mb-6">
                        <h3 class="text-2xl font-black text-slate-800">حساب جديد</h3>
                        <p class="text-sm text-slate-500 font-bold mt-1">احتفظ بكروتك ومشترياتك في مكان واحد</p>
                    </div>

                    <form onsubmit="handleCustomerRegister(event)" class="space-y-4">
                        <div>
                            <input type="text" id="regName" required placeholder="الاسم الكامل" class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 focus:bg-white font-bold text-slate-700 transition-all">
                        </div>

                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-violet-600 font-black border-r border-slate-200 pr-3 my-2" dir="ltr">+967</div>
                            <input type="tel" id="regPhone" required placeholder="رقم الجوال (بدون مسافات)" class="w-full pl-[4.5rem] pr-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 focus:bg-white text-left dir-ltr text-lg font-black text-slate-700 tracking-widest transition-all" dir="ltr">
                        </div>

                        <div class="relative">
                            <input type="password" id="regPassword" required placeholder="كلمة المرور" class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 focus:bg-white text-left dir-ltr text-lg font-bold text-slate-700 tracking-widest transition-all" dir="ltr">
                            <button type="button" onclick="togglePassword('regPassword', 'regEyeIcon')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-violet-600">
                                <svg id="regEyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                        </div>

                        <button type="submit" id="regBtn" class="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-black text-lg py-4 rounded-2xl shadow-xl shadow-violet-200/50 hover:shadow-violet-300 transition-all hover:-translate-y-0.5 mt-2">
                            إنشاء الحساب 🚀
                        </button>
                    </form>

                    <div class="mt-5 text-center border-t border-slate-100 pt-4">
                        <p class="text-sm font-bold text-slate-500">لديك حساب بالفعل؟ <button onclick="toggleAuthView('login')" class="text-violet-600 hover:text-violet-700 hover:underline">تسجيل الدخول</button></p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- هندسة الجافاسكريبت -->
    <script>
        const modal = document.getElementById('authModal');
        const modalContent = document.getElementById('authModalContent');
        const loginView = document.getElementById('loginFormContainer');
        const registerView = document.getElementById('registerFormContainer');

        function openAuthModal(viewType = 'login') {
            toggleAuthView(viewType);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modalContent.classList.remove('modal-enter');
                modalContent.classList.add('modal-active');
            }, 10);
        }

        function closeAuthModal() {
            modalContent.classList.remove('modal-active');
            modalContent.classList.add('modal-enter');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        function toggleAuthView(viewType) {
            if (viewType === 'login') {
                registerView.classList.add('hidden');
                loginView.classList.remove('hidden');
            } else {
                loginView.classList.add('hidden');
                registerView.classList.remove('hidden');
            }
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.29 3.29m0 0a10.05 10.05 0 015.71-1.59c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
            }
        }

        // ==========================================
        // إرسال طلب تسجيل الدخول (Login)
        // ==========================================
        async function handleCustomerLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'جاري التحقق... ⏳';
            btn.disabled = true;

            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('https://wifi-platform.onrender.com/api/customer/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('customer_token', result.token);
                    localStorage.setItem('customer_name', result.customer.name);
                    alert(`✅ أهلاً بك يا ${result.customer.name}! تم تسجيل دخولك بنجاح.`);
                    closeAuthModal();
                } else {
                    alert('❌ خطأ: ' + result.message);
                }
            } catch (error) {
                alert('❌ فشل الاتصال بالسيرفر.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // ==========================================
        // إرسال طلب إنشاء حساب (Register)
        // ==========================================
        async function handleCustomerRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;

            // التحقق برمجياً من الرقم لضمان عدم حدوث خطأ صامت
            if(phone.length < 9) {
                alert('الرجاء كتابة رقم جوال صحيح يتكون من 9 أرقام على الأقل');
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = 'جاري إنشاء الحساب... ⏳';
            btn.disabled = true;

            try {
                const response = await fetch('https://wifi-platform.onrender.com/api/customer/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, password })
                });
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('customer_token', result.token);
                    localStorage.setItem('customer_name', result.customer.name);
                    alert(`✅ تم إنشاء حسابك بنجاح يا ${result.customer.name}!`);
                    closeAuthModal();
                } else {
                    alert('❌ خطأ: ' + result.message);
                }
            } catch (error) {
                alert('❌ فشل الاتصال بالسيرفر. تأكد أنه Live.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
