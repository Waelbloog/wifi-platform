<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر ميتا ترون | الدفع الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { display: none; }
        .modal-enter { opacity: 0; transform: translateY(100%); }
        .modal-active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-24 selection:bg-violet-200">

    <!-- خلفيات زينة -->
    <div class="fixed top-0 left-0 w-full h-96 bg-gradient-to-b from-violet-100/50 to-transparent -z-10 pointer-events-none"></div>

    <!-- الشريط العلوي -->
    <nav class="bg-white/80 backdrop-blur-md shadow-sm border-b border-white sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-violet-600 to-fuchsia-500 rounded-xl flex items-center justify-center text-white font-black shadow-md shadow-violet-200">
                    M
                </div>
                <div>
                    <!-- سيتم تغيير هذا الاسم ديناميكياً من قاعدة البيانات -->
                    <h1 class="font-black text-slate-800 text-lg leading-tight">جاري التحميل...</h1>
                    <span class="text-[10px] text-violet-600 font-bold bg-violet-50 px-2 py-0.5 rounded-full border border-violet-100">بوابتك للإنترنت السريع</span>
                </div>
            </div>
            <button class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm px-4 py-2 rounded-xl transition-colors">
                تسجيل الدخول
            </button>
        </div>
    </nav>

    <div class="container mx-auto px-4 max-w-5xl pt-8">
        
        <!-- لافتة التعليمات -->
        <div class="bg-white rounded-2xl p-4 mb-8 flex items-start gap-4 shadow-xl shadow-slate-200/40 border border-white relative overflow-hidden">
            <div class="absolute right-0 top-0 h-full w-1.5 bg-gradient-to-b from-violet-500 to-fuchsia-500"></div>
            <div class="bg-violet-50 text-violet-600 p-3 rounded-2xl flex-shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div>
                <h3 class="font-black text-slate-700 mb-1">دفع إلكتروني لحظي ⚡</h3>
                <p class="text-sm text-slate-500 mb-2 font-semibold">اختر الكروت، ادفع عبر محفظتك، وسيتم تسجيل دخولك للشبكة تلقائياً.</p>
            </div>
        </div>

        <!-- شبكة الكروت -->
        <div id="packagesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-10 text-violet-500 font-bold animate-pulse">
                جاري الاتصال بخوادم ميتا ترون... ⏳
            </div>
        </div>
    </div>

    <!-- شريط إتمام الشراء العائم -->
    <div id="checkoutBar" class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-lg border-t border-slate-100 p-4 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.05)] z-40 transform transition-transform translate-y-full">
        <div class="container mx-auto max-w-5xl flex justify-between items-center">
            <div>
                <span class="text-xs font-bold text-slate-400 block mb-1">الإجمالي المطلوب</span>
                <div class="flex items-end gap-1">
                    <span id="totalPrice" class="text-2xl font-black text-violet-600 leading-none">0</span>
                    <span class="text-sm font-bold text-slate-600 pb-0.5">ر.ي</span>
                </div>
            </div>
            <button onclick="openPaymentModal()" class="bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:shadow-lg hover:shadow-violet-300 hover:-translate-y-0.5 transform transition-all text-white font-black text-lg px-8 py-3.5 rounded-2xl flex items-center gap-2">
                إتمام الدفع
                <svg class="w-5 h-5 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>
    </div>

    <!-- نافذة الدفع المنبثقة -->
    <div id="paymentModal" class="fixed inset-0 z-50 hidden flex-col justify-end sm:justify-center items-center">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closePaymentModal()"></div>
        <div id="modalContent" class="modal-enter relative bg-white w-full sm:w-[400px] rounded-t-[2.5rem] sm:rounded-[2.5rem] p-8 shadow-2xl transition-all duration-300">
            <button onclick="closePaymentModal()" class="absolute top-6 left-6 text-slate-400 hover:bg-slate-100 p-2 rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            
            <h3 class="text-2xl font-black text-slate-800 mb-6">تأكيد الشراء</h3>
            
            <form onsubmit="processPayment(event)">
                <div class="mb-5">
                    <label class="block text-sm font-bold text-slate-600 mb-3">اختر محفظتك:</label>
                    <div class="grid grid-cols-3 gap-3">
                        <label class="cursor-pointer group"><input type="radio" name="wallet" value="jawali" class="peer sr-only" checked><div class="text-center py-3 rounded-2xl border-2 border-slate-100 peer-checked:border-violet-500 peer-checked:bg-violet-50 transition-all"><span class="block text-xs font-bold text-slate-600 peer-checked:text-violet-700">جوالي</span></div></label>
                        <label class="cursor-pointer group"><input type="radio" name="wallet" value="floosak" class="peer sr-only"><div class="text-center py-3 rounded-2xl border-2 border-slate-100 peer-checked:border-fuchsia-500 peer-checked:bg-fuchsia-50 transition-all"><span class="block text-xs font-bold text-slate-600 peer-checked:text-fuchsia-700">فلوسك</span></div></label>
                        <label class="cursor-pointer group"><input type="radio" name="wallet" value="kuraimi" class="peer sr-only"><div class="text-center py-3 rounded-2xl border-2 border-slate-100 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 transition-all"><span class="block text-xs font-bold text-slate-600 peer-checked:text-emerald-700">الكريمي</span></div></label>
                    </div>
                </div>

                <div class="mb-8">
                    <label class="block text-sm font-bold text-slate-600 mb-2">رقم الجوال:</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400 font-bold" dir="ltr">+967</div>
                        <input type="tel" id="phoneInput" required pattern="[0-9]{9}" placeholder="7XX XXX XXX" class="w-full pl-14 pr-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 text-left dir-ltr text-lg font-black text-slate-700 tracking-widest" dir="ltr">
                    </div>
                </div>

                <button type="submit" id="paySubmitBtn" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-slate-800 transition-colors">
                    ادفع <span id="modalTotal">0</span> ريال
                </button>
            </form>
        </div>
    </div>

    <!-- العقل المدبر للواجهة (جافاسكريبت) -->
    <script>
        // 💡 هنا نضع الرابط الفريد الخاص بشبكتك
        const storeSlug = 'الماهر-نت-721'; 
        
        let cart = {}; 
        let packagesData = []; 
        let totalAmount = 0;
        let networkId = 1; // سنقوم بتحديثها لتصبح ديناميكية لاحقاً لعملية الدفع

        // 1. جلب البيانات من السيرفر باستخدام (رابط الشبكة)
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('packagesContainer');
            try {
                const response = await fetch(`https://wifi-platform.onrender.com/api/store-packages/${storeSlug}`);
                
                if (!response.ok) throw new Error('Server not ready');
                
                const data = await response.json();

                if (data.success && data.packages.length > 0) {
                    packagesData = data.packages;
                    
                    // تغيير اسم المتجر في الأعلى ديناميكياً ليطابق اسم الشبكة من قاعدة البيانات!
                    document.querySelector('h1').innerText = `متجر ${data.network_name}`;
                    
                    renderPackages();
                } else {
                    container.innerHTML = '<div class="col-span-full text-center text-rose-500 font-bold">لا توجد باقات متاحة حالياً. (خزنة هذه الشبكة فارغة)</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="col-span-full text-center text-rose-500 font-bold">❌ فشل الاتصال بخوادم ميتا ترون.</div>';
            }
        });

        // 2. رسم الكروت في الواجهة
        function renderPackages() {
            const container = document.getElementById('packagesContainer');
            container.innerHTML = '';

            packagesData.forEach(pkg => {
                const isAvailable = parseInt(pkg.available_cards) > 0;
                const qty = cart[pkg.id] || 0;

                const cardHTML = `
                    <div class="bg-white rounded-3xl shadow-lg shadow-slate-200/30 border border-white overflow-hidden relative flex flex-col transition-all hover:-translate-y-1 ${!isAvailable ? 'opacity-60 grayscale' : ''}">
                        ${isAvailable 
                            ? `<div class="absolute top-4 right-[-35px] bg-gradient-to-r from-emerald-400 to-emerald-500 text-white px-10 py-1 text-xs font-bold transform rotate-45 shadow-sm">متوفر</div>`
                            : `<div class="absolute top-4 right-[-35px] bg-rose-500 text-white px-10 py-1 text-xs font-bold transform rotate-45 shadow-sm">نفد</div>`
                        }
                        
                        <div class="p-6 border-b border-slate-50">
                            <h2 class="text-2xl font-black text-slate-700 mb-4">${pkg.name}</h2>
                            <div class="flex items-end gap-1 mb-2">
                                <span class="text-3xl font-black text-violet-600 leading-none">${pkg.price}</span>
                                <span class="text-sm font-bold text-slate-500">ر.ي</span>
                            </div>
                        </div>
                        
                        <div class="p-5 bg-slate-50/50 flex items-center justify-between mt-auto">
                            <button onclick="updateCart(${pkg.id}, -1)" class="w-10 h-10 rounded-xl bg-white border border-slate-200 text-slate-500 font-bold text-xl hover:border-violet-500 hover:text-violet-600 transition-colors shadow-sm" ${!isAvailable || qty === 0 ? 'disabled' : ''}>-</button>
                            <span class="font-black text-xl text-slate-800">${qty}</span>
                            <button onclick="updateCart(${pkg.id}, 1)" class="w-10 h-10 rounded-xl bg-white border border-slate-200 text-slate-500 font-bold text-xl hover:border-violet-500 hover:text-violet-600 transition-colors shadow-sm" ${!isAvailable ? 'disabled' : ''}>+</button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // 3. تحديث السلة والمبلغ الإجمالي
        function updateCart(pkgId, change) {
            if (!cart[pkgId]) cart[pkgId] = 0;
            cart[pkgId] += change;
            
            if (cart[pkgId] < 0) cart[pkgId] = 0;
            
            calculateTotal();
            renderPackages();
        }

        function calculateTotal() {
            totalAmount = 0;
            let totalItems = 0;

            packagesData.forEach(pkg => {
                if (cart[pkg.id]) {
                    totalAmount += (cart[pkg.id] * pkg.price);
                    totalItems += cart[pkg.id];
                }
            });

            document.getElementById('totalPrice').innerText = totalAmount;
            document.getElementById('modalTotal').innerText = totalAmount;

            const checkoutBar = document.getElementById('checkoutBar');
            if (totalItems > 0) {
                checkoutBar.classList.remove('translate-y-full');
            } else {
                checkoutBar.classList.add('translate-y-full');
            }
        }

        // 4. التحكم بنافذة الدفع
        const modal = document.getElementById('paymentModal');
        const modalContent = document.getElementById('modalContent');

        function openPaymentModal() {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modalContent.classList.remove('modal-enter');
                modalContent.classList.add('modal-active');
            }, 10);
        }

        function closePaymentModal() {
            modalContent.classList.remove('modal-active');
            modalContent.classList.add('modal-enter');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        // 5. إرسال طلب الدفع الفعلي للسيرفر
        async function processPayment(e) {
            e.preventDefault();
            const btn = document.getElementById('paySubmitBtn');
            const phoneInput = document.getElementById('phoneInput').value;
            
            const selectedWallet = document.querySelector('input[name="wallet"]:checked').value;
            const package_id = Object.keys(cart)[0];

            if (!package_id) {
                alert('الرجاء اختيار باقة أولاً');
                return;
            }

            const originalBtnText = btn.innerHTML;
            btn.innerHTML = 'جاري معالجة الدفع... ⏳';
            btn.disabled = true;

            try {
                const response = await fetch('https://wifi-platform.onrender.com/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        network_id: networkId,
                        package_id: package_id,
                        phone: phoneInput,
                        wallet: selectedWallet,
                        amount: totalAmount
                    })
                });

                const result = await response.json();

                if (result.success) {
                    closePaymentModal();
                    
                    const cardHTML = `
                        <div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
                            <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl animate-bounce">
                                <div class="w-20 h-20 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <h2 class="text-2xl font-black text-slate-800 mb-2">تم الشراء بنجاح!</h2>
                                <p class="text-slate-500 mb-6 font-bold">بيانات الدخول لشبكتك:</p>
                                
                                <div class="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 mb-6">
                                    <p class="text-sm text-slate-400 font-bold mb-1">اسم المستخدم / رقم الكرت</p>
                                    <p class="text-3xl font-black text-violet-600 tracking-widest" dir="ltr">${result.card.username}</p>
                                    
                                    ${result.card.password ? `
                                    <div class="h-px bg-slate-200 my-4 w-1/2 mx-auto"></div>
                                    <p class="text-sm text-slate-400 font-bold mb-1">كلمة المرور</p>
                                    <p class="text-xl font-black text-slate-700 tracking-widest" dir="ltr">${result.card.password}</p>
                                    ` : ''}
                                </div>
                                
                                <button onclick="location.reload()" class="w-full bg-violet-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-violet-700 transition-colors">إغلاق وتسجيل الدخول تلقائياً</button>
                            </div>
                        </div>
                    `;
                    document.body.insertAdjacentHTML('beforeend', cardHTML);
                    
                } else {
                    alert('❌ فشل الدفع: ' + result.message);
                    btn.innerHTML = originalBtnText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.');
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
