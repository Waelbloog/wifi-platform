<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميتا ترون | انضمام أصحاب الشبكات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-violet-200 p-4">

    <!-- خلفيات زينة -->
    <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-violet-600/20 rounded-full blur-3xl -z-10"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-fuchsia-600/20 rounded-full blur-3xl -z-10"></div>

    <div class="bg-white/80 backdrop-blur-xl p-10 rounded-[3rem] shadow-2xl shadow-violet-200/50 w-full max-w-md border border-white">
        
        <!-- اللوجو -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-tr from-violet-600 to-fuchsia-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-violet-300">
                <span class="text-white font-black text-3xl">M</span>
            </div>
            <h1 class="text-3xl font-black text-slate-800">ميتا <span class="text-transparent bg-clip-text bg-gradient-to-l from-violet-400 to-fuchsia-500">ترون</span></h1>
            <p class="text-slate-500 font-bold mt-2 text-sm">أتمتة شبكتك تبدأ من هنا ⚡</p>
        </div>

        <!-- نموذج التسجيل -->
        <form id="registerForm" class="space-y-5">
            
            <div>
                <label class="block text-sm font-bold text-slate-600 mb-2">اسم المالك الحقيقي</label>
                <input type="text" id="ownerName" required placeholder="مثال: محمد زيد" class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 font-bold text-slate-700 transition-colors">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-600 mb-2">البريد الإلكتروني (لتسجيل الدخول)</label>
                <input type="email" id="email" required placeholder="admin@network.com" class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 text-left font-bold text-slate-700 transition-colors" dir="ltr">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-600 mb-2">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 text-left font-bold text-slate-700 tracking-widest transition-colors" dir="ltr">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-600 mb-2">اسم شبكة الواي فاي</label>
                <input type="text" id="networkName" required placeholder="مثال: الماهر نت" class="w-full px-5 py-4 bg-violet-50 border-2 border-violet-100 rounded-2xl focus:outline-none focus:border-violet-500 font-black text-violet-700 transition-colors placeholder:text-violet-300">
                <p class="text-[11px] text-slate-400 mt-2 font-bold">سيتم استخدام هذا الاسم لإنشاء رابط متجرك الخاص.</p>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-black text-lg py-4 rounded-2xl shadow-lg shadow-violet-200/50 hover:-translate-y-1 transform transition-all mt-4">
                إنشاء حساب مجاني 🚀
            </button>
        </form>

        <!-- رسالة النجاح المخفية -->
        <div id="successBox" class="hidden mt-6 bg-emerald-50 border-2 border-emerald-100 p-5 rounded-2xl text-center">
            <div class="w-12 h-12 bg-emerald-500 text-white rounded-full flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h3 class="font-black text-emerald-700 mb-1">تم إنشاء شبكتك بنجاح!</h3>
            <p class="text-sm font-bold text-emerald-600 mb-4">هذا هو رابط المتجر الخاص بعملائك:</p>
            <input type="text" id="storeLink" readonly class="w-full text-center text-xs font-mono font-bold bg-white border border-emerald-200 py-3 px-2 rounded-xl text-slate-600 mb-3" dir="ltr">
            <button onclick="copyLink()" class="text-xs font-black text-white bg-slate-800 px-4 py-2 rounded-lg hover:bg-slate-700 transition-colors">نسخ الرابط والذهاب للوحة التحكم</button>
        </div>

    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'جاري بناء شبكتك... ⏳';
            btn.disabled = true;

            const owner_name = document.getElementById('ownerName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const network_name = document.getElementById('networkName').value;

            try {
                // إرسال البيانات لسيرفر ميتا ترون
                const response = await fetch('https://wifi-platform.onrender.com/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ owner_name, email, password, network_name })
                });

                const result = await response.json();

                if (result.success) {
                    // إخفاء النموذج وإظهار رابط المتجر
                    document.getElementById('registerForm').classList.add('hidden');
                    const successBox = document.getElementById('successBox');
                    successBox.classList.remove('hidden');
                    
                    // وضع الرابط في المربع (مع تعديله ليناسب مشروعنا)
                    const storeSlug = result.store_url.split('/').pop();
                    document.getElementById('storeLink').value = `https://metatron.com/store/${storeSlug}`;
                } else {
                    alert('❌ خطأ: ' + result.message);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ فشل الاتصال بالسيرفر. تأكد أنه يعمل (Live).');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        function copyLink() {
            const linkInput = document.getElementById('storeLink');
            linkInput.select();
            document.execCommand('copy');
            alert('✅ تم نسخ الرابط! احتفظ به، هذا هو رابط متجر شبكتك.');
        }
    </script>
</body>
</html>
