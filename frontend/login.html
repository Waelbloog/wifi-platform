<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميتا ترون | تسجيل دخول مديري الشبكات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden selection:bg-violet-200">

    <!-- خلفيات النيون الجمالية -->
    <div class="absolute top-[-20%] left-[-10%] w-96 h-96 bg-violet-600/30 rounded-full blur-[100px] -z-10 animate-pulse"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-96 h-96 bg-fuchsia-600/20 rounded-full blur-[100px] -z-10 animate-pulse"></div>

    <div class="w-full max-w-md px-6 z-10">
        
        <!-- اللوجو والترحيب -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-tr from-violet-600 to-fuchsia-500 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-violet-500/30 transform rotate-3 hover:rotate-0 transition-transform">
                <span class="text-white font-black text-4xl">M</span>
            </div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tight">ميتا <span class="text-transparent bg-clip-text bg-gradient-to-l from-violet-600 to-fuchsia-500">ترون</span></h1>
            <p class="text-slate-500 font-bold mt-2">بوابة الدخول لمديري وأصحاب الشبكات</p>
        </div>

        <!-- صندوق تسجيل الدخول -->
        <div class="glass-card rounded-[2.5rem] p-8 sm:p-10 shadow-2xl shadow-violet-900/5 border border-white">
            
            <form id="loginForm" onsubmit="submitLogin(event)">
                
                <!-- رقم الهاتف -->
                <div class="mb-5">
                    <label class="block text-sm font-bold text-slate-600 mb-2">رقم الهاتف المرتبط بالشبكة</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-violet-600 font-black border-r border-slate-200 pr-3 my-2" dir="ltr">YE +967</div>
                        <input type="tel" id="phone" required placeholder="7XX XXX XXX" maxlength="9" class="w-full pl-[6.5rem] pr-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 text-left dir-ltr text-lg font-black text-slate-700 tracking-widest transition-colors" dir="ltr">
                    </div>
                </div>

                <!-- كلمة المرور -->
                <div class="mb-8">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-bold text-slate-600">كلمة المرور</label>
                        <a href="#" class="text-xs font-bold text-violet-600 hover:text-violet-700">نسيت الرمز؟</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="••••••••" class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 text-left dir-ltr font-black text-slate-700 tracking-widest transition-colors" dir="ltr">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-violet-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                </div>

                <p id="errorMessage" class="text-rose-500 text-sm font-bold mb-4 text-center hidden">رقم الهاتف أو كلمة المرور غير صحيحة.</p>

                <!-- زر الدخول -->
                <button type="submit" id="loginBtn" class="w-full bg-slate-900 text-white font-black text-lg py-4 rounded-2xl shadow-lg hover:bg-slate-800 transition-all hover:-translate-y-1 flex items-center justify-center gap-2">
                    دخول للوحة القيادة <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                </button>

            </form>

            <div class="mt-8 text-center">
                <p class="text-sm font-bold text-slate-500">ليس لديك شبكة مسجلة؟ <a href="register.html" class="text-violet-600 hover:text-violet-700 underline">قدم طلب انضمام الآن</a></p>
            </div>

        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function submitLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');

            if (phone.length !== 9 || !phone.startsWith('7')) {
                errorMsg.innerText = "الرجاء إدخال رقم هاتف يمني صحيح (9 أرقام يبدأ بـ 7)";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'جاري التحقق... ⏳';
            btn.disabled = true;

            try {
                // 💡 نستخدم نفس خدعة البريد الإلكتروني التي استخدمناها في صفحة التسجيل
                // لكي يتطابق مع الباك إند الحالي للمنصة
                const emailToLogin = `net_${phone}@metatron.local`;

                const response = await fetch('https://wifi-platform.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailToLogin, password: password })
                });

                const result = await response.json();

                if (result.success) {
                    // ✅ تم تسجيل الدخول بنجاح!
                    // نحفظ التوكن (Token) وبيانات الشبكة في المتصفح لكي تقرأها صفحة admin.html
                    localStorage.setItem('metatron_token', result.token);
                    
                    // حفظ بيانات مبدئية لتعرض في لوحة التحكم
                    localStorage.setItem('network_id', result.user.id || 1);
                    localStorage.setItem('network_name', result.user.network_name || 'شبكتي الخاصة');
                    localStorage.setItem('network_slug', result.user.network_slug || 'الماهر-نت-721');

                    // توجيه المدير لغرفة العمليات (لوحة القيادة)
                    window.location.href = 'admin.html';
                } else {
                    errorMsg.innerText = "❌ فشل الدخول: " + (result.message || "البيانات غير متطابقة.");
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = "❌ حدث خطأ في الاتصال بخوادم ميتا ترون.";
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
