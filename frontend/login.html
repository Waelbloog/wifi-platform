<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميتا ترون | دخول أصحاب الشبكات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-violet-200 p-4">

    <!-- خلفيات زينة -->
    <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-violet-600/20 rounded-full blur-3xl -z-10"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-fuchsia-600/20 rounded-full blur-3xl -z-10"></div>

    <div class="bg-white/80 backdrop-blur-xl p-10 rounded-[3rem] shadow-2xl shadow-violet-200/50 w-full max-w-md border border-white">
        
        <!-- اللوجو -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-tr from-violet-600 to-fuchsia-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-violet-300">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
            </div>
            <h1 class="text-3xl font-black text-slate-800">تسجيل الدخول</h1>
            <p class="text-slate-500 font-bold mt-2 text-sm">مرحباً بعودتك إلى منصة ميتا ترون ⚡</p>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-600 mb-2">رقم الهاتف اليمني</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-violet-600 font-black border-r border-slate-200 pr-3 my-2" dir="ltr">YE +967</div>
                    <input type="tel" id="phone" required placeholder="7XX XXX XXX" maxlength="9" class="w-full pl-[6.5rem] pr-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 text-left dir-ltr text-lg font-black text-slate-700 tracking-widest transition-colors" dir="ltr">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-600 mb-2">كلمة المرور</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:outline-none focus:border-violet-500 text-left font-bold text-slate-700 tracking-widest transition-colors" dir="ltr">
                    <button type="button" onclick="togglePassword('password')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-violet-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white font-black text-lg py-4 rounded-2xl shadow-xl hover:bg-slate-800 transform transition-all mt-4 flex justify-center items-center gap-2">
                دخول للوحة التحكم 🚀
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm font-bold text-slate-500">ليس لديك حساب؟ <a href="register.html" class="text-violet-600 hover:underline">انضم إلينا كصاحب شبكة</a></p>
        </div>
    </div>

    <script>
        // دالة إظهار/إخفاء كلمة المرور
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'جاري التحقق... ⏳';
            btn.disabled = true;

            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            // تحقق بسيط من صحة الرقم قبل الإرسال
            if(phone.length !== 9 || !phone.startsWith('7')) {
                alert('الرجاء إدخال رقم يمني صحيح (يبدأ بـ 7 ويتكون من 9 أرقام)');
                btn.innerHTML = originalText;
                btn.disabled = false;
                return;
            }

            try {
                // إرسال البيانات للسيرفر المحلي (Localhost)
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password }) // إرسال الرقم وكلمة المرور
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('metatron_token', result.token);
                    localStorage.setItem('network_id', result.network_data.id);
                    localStorage.setItem('network_name', result.network_data.network_name);
                    localStorage.setItem('network_slug', result.network_data.slug);

                    alert(`✅ أهلاً بك يا صاحب شبكة (${result.network_data.network_name})! \nجاري تحويلك للوحة التحكم...`);
                    window.location.href = 'admin.html';
                } else {
                    alert('❌ خطأ: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ فشل الاتصال بالسيرفر. تأكد أن السيرفر يعمل (node server.js).');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
