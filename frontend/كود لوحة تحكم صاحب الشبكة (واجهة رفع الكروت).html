<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميتا ترون | لوحة تحكم الشبكة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, #8b5cf6, #d946ef); border-radius: 10px; }
    </style>
    <!-- حماية لوحة التحكم: التحقق من تسجيل الدخول -->
    <script>
        if (!localStorage.getItem('metatron_token')) {
            alert('🚫 غير مصرح لك بالدخول. الرجاء تسجيل الدخول أولاً.');
            window.location.href = 'login.html'; // توجيه المستخدم لصفحة تسجيل الدخول
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden selection:bg-violet-200">

    <!-- شريط المهام الجانبي (Sidebar) -->
    <aside class="w-72 bg-slate-900 text-slate-300 flex flex-col hidden lg:flex transition-all duration-300 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-64 h-64 bg-violet-600/20 rounded-full blur-3xl -z-10"></div>
        
        <div class="h-20 flex items-center justify-center border-b border-slate-800/50 bg-slate-900/50 backdrop-blur-sm z-10">
            <h1 class="text-3xl font-black text-white tracking-wider">ميتا <span class="text-transparent bg-clip-text bg-gradient-to-l from-violet-400 to-fuchsia-500">ترون</span></h1>
        </div>
        
        <div class="p-6 z-10">
            <p class="text-xs font-bold text-slate-500 mb-4 uppercase tracking-wider">القائمة الرئيسية</p>
            <nav class="space-y-3">
                <a href="#" class="flex items-center gap-3 bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white px-4 py-3 rounded-2xl shadow-lg shadow-violet-900/40 transition-all font-bold transform hover:-translate-y-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    إدارة الكروت ورفعها
                </a>
                <button onclick="logout()" class="w-full flex items-center gap-3 text-rose-400 hover:text-white hover:bg-rose-500/20 px-4 py-3 rounded-2xl transition-all mt-10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    تسجيل الخروج
                </button>
            </nav>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50 relative">
        <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-violet-50/50 to-transparent pointer-events-none"></div>

        <!-- الشريط العلوي -->
        <header class="h-20 bg-white/70 backdrop-blur-xl border-b border-white/50 flex items-center justify-between px-8 z-20 shadow-sm shadow-slate-100">
            <h2 class="text-2xl font-black text-slate-800">إدارة كروت <span id="dashboardTitle" class="text-violet-600">شبكتي</span></h2>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                    <div class="text-left hidden md:block">
                        <p class="text-sm font-bold text-slate-700">مدير النظام</p>
                        <!-- سيتم تحديث هذا الاسم برمجياً -->
                        <p id="adminNetworkName" class="text-xs text-violet-500 font-bold">متصل بـ ميتا ترون</p>
                    </div>
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 to-fuchsia-500 text-white flex items-center justify-center font-black shadow-md shadow-violet-200">M</div>
                </div>
            </div>
        </header>

        <!-- مساحة العمل -->
        <div class="flex-1 overflow-y-auto p-8 z-10">
            <div class="max-w-5xl mx-auto space-y-8">
                
                <!-- قسم رفع الكروت -->
                <div class="bg-white rounded-[2rem] p-2 shadow-xl shadow-slate-200/40 border border-white">
                    <div class="border-2 border-dashed border-violet-200 rounded-[1.5rem] bg-violet-50/30 p-10 text-center hover:bg-violet-50/80 hover:border-violet-400 transition-all duration-300 relative group cursor-pointer overflow-hidden">
                        
                        <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept=".csv, .xlsx, .txt">
                        
                        <div class="w-24 h-24 mx-auto bg-white rounded-3xl shadow-md border border-violet-100 flex items-center justify-center text-violet-500 mb-5 group-hover:scale-110 group-hover:rotate-3 transition-transform duration-300">
                            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        </div>
                        <h3 class="text-2xl font-black text-slate-700 mb-2">اسحب وأفلت ملف الكروت هنا</h3>
                        <p class="text-slate-400 text-sm mb-8 font-semibold">لرفعها مباشرة إلى متجر شبكتك.</p>
                        
                        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 relative z-20">
                            <!-- الباقات (الآن تقرأ ديناميكياً من السيرفر) -->
                            <div class="relative w-full sm:w-64">
                                <select id="packageSelect" class="w-full appearance-none bg-white border-2 border-violet-100 text-slate-700 text-sm rounded-2xl focus:outline-none focus:border-violet-500 block p-4 shadow-sm font-bold transition-colors cursor-pointer">
                                    <option value="" disabled selected>جاري جلب الباقات...</option>
                                    <!-- سيتم تعبئتها بالجافاسكريبت -->
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-4 text-violet-500">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                            
                            <button id="uploadBtn" class="w-full sm:w-auto bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold px-8 py-4 rounded-2xl shadow-lg shadow-violet-200/50 hover:shadow-violet-300 transition-all duration-300 pointer-events-none opacity-50 flex items-center justify-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                <span>رفع الكروت</span>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // 💡 1. تحميل بيانات الشبكة من الذاكرة (SaaS Magic)
        const myNetworkId = localStorage.getItem('network_id');
        const myNetworkName = localStorage.getItem('network_name');
        const myNetworkSlug = localStorage.getItem('network_slug');

        // تحديث الواجهة باسم الشبكة الحقيقي
        document.getElementById('dashboardTitle').innerText = myNetworkName;
        document.getElementById('adminNetworkName').innerText = `متصل بـ ${myNetworkName}`;

        // 💡 2. جلب باقات هذه الشبكة فقط لتظهر في القائمة المنسدلة
        async function loadMyPackages() {
            const select = document.getElementById('packageSelect');
            try {
                const response = await fetch(`https://wifi-platform.onrender.com/api/store-packages/${myNetworkSlug}`);
                const data = await response.json();
                
                if (data.success && data.packages.length > 0) {
                    select.innerHTML = '<option value="" disabled selected>اختر الباقة لربط الكروت...</option>';
                    data.packages.forEach(pkg => {
                        select.innerHTML += `<option value="${pkg.id}">${pkg.name} (${pkg.price} ريال)</option>`;
                    });
                } else {
                    select.innerHTML = '<option value="" disabled selected>لا توجد باقات في شبكتك</option>';
                }
            } catch (err) {
                console.error(err);
                select.innerHTML = '<option value="" disabled selected>❌ فشل جلب الباقات</option>';
            }
        }
        
        // تشغيل دالة جلب الباقات عند تحميل الصفحة
        loadMyPackages();

        // 💡 3. رفع الكروت إلى خزنة هذه الشبكة فقط
        const fileInput = document.querySelector('input[type="file"]');
        const dropZone = fileInput.parentElement;
        const packageSelect = document.getElementById('packageSelect');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusTitle = dropZone.querySelector('h3');
        
        let selectedFile = null;

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('bg-violet-100/50', 'border-violet-500', 'scale-[1.02]'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('bg-violet-100/50', 'border-violet-500', 'scale-[1.02]'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            selectedFile = e.dataTransfer.files[0];
            checkReadyToUpload();
        });

        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            checkReadyToUpload();
        });

        packageSelect.addEventListener('change', checkReadyToUpload);

        function checkReadyToUpload() {
            if (selectedFile) {
                statusTitle.innerText = `ملف جاهز: ${selectedFile.name}`;
                statusTitle.classList.add('text-violet-600');
            }
            if (selectedFile && packageSelect.value !== "") {
                uploadBtn.classList.remove('pointer-events-none', 'opacity-50');
                uploadBtn.classList.add('hover:-translate-y-1');
                uploadBtn.querySelector('span').innerText = 'رفع الكروت الآن 🚀';
            }
        }

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile || packageSelect.value === "") return;

            const originalHTML = uploadBtn.innerHTML;
            uploadBtn.innerHTML = '<span class="flex items-center gap-2"><svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> جاري المعالجة...</span>';
            uploadBtn.classList.add('pointer-events-none', 'opacity-80');
            uploadBtn.classList.remove('hover:-translate-y-1');

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('package_id', packageSelect.value);
            // 🚀 هنا نرسل معرف شبكتك أنت فقط للسيرفر!
            formData.append('network_id', myNetworkId); 

            try {
                const response = await fetch('https://wifi-platform.onrender.com/api/upload-cards', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    alert('✅ تمت العملية بنجاح:\n' + result.message);
                    selectedFile = null;
                    packageSelect.value = "";
                    statusTitle.innerText = 'اسحب وأفلت ملف الكروت هنا';
                    statusTitle.classList.remove('text-violet-600');
                    fileInput.value = ""; 
                } else {
                    alert('❌ خطأ: ' + result.message);
                }
            } catch (error) {
                console.error('Network Error:', error);
                alert('❌ فشل الاتصال بخوادم ميتا ترون.');
            } finally {
                uploadBtn.innerHTML = originalHTML;
                uploadBtn.classList.add('pointer-events-none', 'opacity-50');
            }
        });

        // دالة تسجيل الخروج
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
