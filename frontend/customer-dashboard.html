<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ميتا ترون | لوحة العميل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        ::-webkit-scrollbar { display: none; }
        .tab-active { border-bottom: 3px solid #8b5cf6; color: #8b5cf6; font-weight: 900; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }
    </style>
    <!-- حماية الصفحة: طرد أي شخص لم يسجل الدخول -->
    <script>
        if (!localStorage.getItem('customer_token')) {
            alert('🚫 الرجاء تسجيل الدخول أولاً.');
            window.location.href = 'index.html'; // توجيه للرئيسية
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-24 selection:bg-violet-200">

    <!-- خلفية علوية زينة -->
    <div class="absolute top-0 left-0 w-full h-72 bg-gradient-to-b from-violet-600 to-fuchsia-600 -z-10 rounded-b-[3rem]"></div>

    <!-- الشريط العلوي -->
    <nav class="pt-6 pb-4 px-4 text-white">
        <div class="container mx-auto max-w-5xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center font-black text-xl shadow-inner border border-white/30">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <div>
                    <p class="text-sm text-violet-100 font-semibold">مرحباً بعودتك،</p>
                    <!-- سيتم وضع اسم العميل هنا ديناميكياً -->
                    <h1 id="customerNameDisplay" class="font-black text-xl leading-tight">جاري التحميل...</h1>
                </div>
            </div>
            <button onclick="logoutCustomer()" class="bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 text-white font-bold text-sm px-4 py-2.5 rounded-xl transition-colors shadow-sm flex items-center gap-2">
                خروج
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </div>
    </nav>

    <div class="container mx-auto px-4 max-w-5xl pt-4">
        
        <!-- بطاقة المحفظة (Wallet Card) -->
        <div class="bg-white rounded-3xl p-6 mb-8 shadow-xl shadow-violet-900/10 border border-slate-100 relative overflow-hidden transform hover:-translate-y-1 transition-transform">
            <div class="absolute top-0 left-0 w-32 h-32 bg-fuchsia-500/10 rounded-full blur-2xl"></div>
            <div class="absolute bottom-0 right-0 w-32 h-32 bg-violet-500/10 rounded-full blur-2xl"></div>
            
            <div class="relative z-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div>
                    <h3 class="text-slate-500 font-bold mb-1 flex items-center gap-2">
                        <svg class="w-5 h-5 text-violet-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                        رصيد المحفظة المتاح
                    </h3>
                    <div class="flex items-end gap-2">
                        <span class="text-4xl font-black text-slate-800 tracking-tight">0.00</span>
                        <span class="text-lg font-bold text-slate-400 mb-1">ر.ي</span>
                    </div>
                </div>
                <button class="w-full sm:w-auto bg-slate-900 text-white font-bold px-6 py-3 rounded-xl hover:bg-slate-800 transition-colors shadow-md">
                    شحن الرصيد +
                </button>
            </div>
        </div>

        <!-- شريط التبويبات (Tabs) -->
        <div class="flex border-b border-slate-200 mb-6 gap-6">
            <button onclick="switchTab('networks')" id="tab-networks" class="tab-active pb-3 text-lg transition-colors flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                الشبكات المتاحة
            </button>
            <button onclick="switchTab('purchases')" id="tab-purchases" class="tab-inactive pb-3 text-lg transition-colors flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                مشترياتي
            </button>
        </div>

        <!-- محتوى التبويبات -->
        <div id="tab-content">
            
            <!-- 1. تبويب الشبكات (Networks) -->
            <div id="view-networks" class="block animate-[fadeIn_0.3s_ease-in-out]">
                <!-- مربع البحث -->
                <div class="relative mb-6">
                    <input type="text" placeholder="ابحث عن شبكة في منطقتك..." class="w-full bg-white border-2 border-slate-100 rounded-2xl py-4 pr-14 pl-4 focus:outline-none focus:border-violet-400 font-bold text-slate-700 shadow-sm transition-colors">
                    <svg class="w-6 h-6 text-slate-400 absolute top-1/2 right-4 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>

                <!-- قائمة الشبكات (سيتم تعبئتها من السيرفر) -->
                <div id="networksList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                    <!-- مثال لشبكة (للتجربة قبل الربط بالسيرفر) -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow group flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center font-black shadow-sm group-hover:scale-105 transition-transform">
                                م
                            </div>
                            <div>
                                <h3 class="font-black text-slate-800">الماهر نت</h3>
                                <p class="text-xs text-emerald-500 font-bold flex items-center gap-1 mt-1">
                                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> متصلة وتعمل
                                </p>
                            </div>
                        </div>
                        <a href="store.html" class="bg-slate-100 hover:bg-violet-600 hover:text-white text-slate-600 px-4 py-2 rounded-xl text-sm font-bold transition-colors">المتجر</a>
                    </div>
                </div>
            </div>

            <!-- 2. تبويب المشتريات (Purchases) -->
            <div id="view-purchases" class="hidden animate-[fadeIn_0.3s_ease-in-out]">
                <div id="purchasesList" class="space-y-4">
                    <!-- حالة عدم وجود مشتريات -->
                    <div class="bg-white p-10 rounded-3xl border border-slate-100 shadow-sm text-center">
                        <div class="w-20 h-20 bg-slate-50 text-slate-300 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        </div>
                        <h3 class="font-black text-slate-700 text-lg mb-2">لا توجد مشتريات سابقة!</h3>
                        <p class="text-sm font-bold text-slate-400">ستظهر الكروت التي تشتريها هنا لكي لا تفقدها أبداً.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. جلب اسم العميل من الذاكرة وعرضه
        const customerName = localStorage.getItem('customer_name');
        if (customerName) {
            document.getElementById('customerNameDisplay').innerText = customerName;
        }

        // 2. دالة التبديل بين التبويبات (الشبكات / المشتريات)
       
        function switchTab(tabName) {
            const tabNetworks = document.getElementById('tab-networks');
            const tabPurchases = document.getElementById('tab-purchases');
            const viewNetworks = document.getElementById('view-networks');
            const viewPurchases = document.getElementById('view-purchases');

            if (tabName === 'networks') {
                tabNetworks.className = 'tab-active pb-3 text-lg transition-colors flex items-center gap-2';
                tabPurchases.className = 'tab-inactive pb-3 text-lg transition-colors flex items-center gap-2';
                viewNetworks.classList.remove('hidden');
                viewNetworks.classList.add('block');
                viewPurchases.classList.remove('block');
                viewPurchases.classList.add('hidden');
            } else {
                tabPurchases.className = 'tab-active pb-3 text-lg transition-colors flex items-center gap-2';
                tabNetworks.className = 'tab-inactive pb-3 text-lg transition-colors flex items-center gap-2';
                viewPurchases.classList.remove('hidden');
                viewPurchases.classList.add('block');
                viewNetworks.classList.remove('block');
                viewNetworks.classList.add('hidden');
                
                // 💡 تشغيل دالة جلب المشتريات عند فتح التبويب!
                loadPurchases(); 
            }
        }

        // 3. دالة تسجيل الخروج للعميل
        function logoutCustomer() {
            localStorage.removeItem('customer_token');
            localStorage.removeItem('customer_name');
            window.location.href = 'index.html'; // العودة للرئيسية
        }
// 5. دالة جلب مشتريات العميل من السيرفر
        async function loadPurchases() {
            const container = document.getElementById('purchasesList');
            const token = localStorage.getItem('customer_token');

            if (!token) return;

            // إظهار حالة التحميل
            container.innerHTML = '<div class="text-center py-10 text-violet-500 font-bold animate-pulse">جاري جلب مشترياتك السابقة... ⏳</div>';

            try {
                const response = await fetch('https://wifi-platform.onrender.com/api/customer/purchases', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.success && data.purchases.length > 0) {
                    container.innerHTML = ''; // تفريغ الشاشة
                    
                    data.purchases.forEach(item => {
                        // تنسيق التاريخ ليظهر بشكل جميل
                        const date = new Date(item.created_at).toLocaleDateString('ar-EG');
                        
                        const cardHTML = `
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4 hover:shadow-md transition-shadow">
                                <div class="text-center md:text-right">
                                    <h4 class="font-black text-slate-800 text-lg">${item.package_name} <span class="text-sm font-bold text-slate-400 font-normal">من شبكة</span> <span class="text-violet-600">${item.network_name}</span></h4>
                                    <p class="text-xs text-slate-400 font-bold mt-2">تاريخ الشراء: ${date} | المبلغ: ${item.amount} ريال</p>
                                </div>
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center min-w-[180px] relative group cursor-pointer" onclick="navigator.clipboard.writeText('${item.username}'); alert('تم نسخ الكرت!')">
                                    <div class="absolute inset-0 bg-violet-600 rounded-xl opacity-0 group-hover:opacity-10 transition-opacity"></div>
                                    <p class="text-[10px] text-slate-400 font-bold mb-1 uppercase tracking-wider">رقم الكرت / اضغط للنسخ</p>
                                    <p class="font-black text-2xl text-slate-700 tracking-widest" dir="ltr">${item.username}</p>
                                </div>
                            </div>
                        `;
                        container.innerHTML += cardHTML;
                    });
                } else {
                    // إذا لم يشترِ شيئاً بعد
                    container.innerHTML = `
                        <div class="bg-white p-10 rounded-3xl border border-slate-100 shadow-sm text-center">
                            <div class="w-20 h-20 bg-slate-50 text-slate-300 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                            </div>
                            <h3 class="font-black text-slate-700 text-lg mb-2">لا توجد مشتريات سابقة!</h3>
                            <p class="text-sm font-bold text-slate-400">ستظهر الكروت التي تشتريها هنا لكي لا تفقدها أبداً.</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="text-center py-10 text-rose-500 font-bold">❌ فشل الاتصال بالسيرفر.</div>';
            }
        }

// 4. دالة جلب الشبكات من السيرفر وعرضها
        async function loadNetworks() {
            const container = document.getElementById('networksList');
            
            try {
                // وضع حالة تحميل مبدئية
                container.innerHTML = '<div class="col-span-full text-center text-violet-500 font-bold animate-pulse">جاري البحث عن الشبكات... ⏳</div>';

                const response = await fetch('https://wifi-platform.onrender.com/api/networks');
                const data = await response.json();

                if (data.success && data.networks.length > 0) {
                    container.innerHTML = ''; // تفريغ القائمة من رسالة التحميل
                    
                    data.networks.forEach(net => {
                        // أخذ أول حرف من اسم الشبكة لجعله أيقونة جميلة
                        const firstLetter = net.network_name.charAt(0);
                        
                        const cardHTML = `
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md hover:-translate-y-1 transition-all duration-300 group flex items-center justify-between">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 bg-gradient-to-tr from-violet-600 to-fuchsia-500 text-white rounded-xl flex items-center justify-center font-black text-xl shadow-sm group-hover:scale-110 transition-transform">
                                        ${firstLetter}
                                    </div>
                                    <div>
                                        <h3 class="font-black text-slate-800">${net.network_name}</h3>
                                        <p class="text-[10px] text-emerald-500 font-bold flex items-center gap-1 mt-1 bg-emerald-50 px-2 py-0.5 rounded-full inline-flex">
                                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> متصلة وتعمل
                                        </p>
                                    </div>
                                </div>
                                <!-- 💡 السر هنا: نضع رابط المتجر ونرسل معه الـ Slug الخاص بالشبكة -->
                                <a href="store.html?net=${net.slug}" class="bg-slate-100 hover:bg-violet-600 hover:shadow-lg hover:shadow-violet-200 hover:text-white text-slate-600 px-5 py-2.5 rounded-xl text-sm font-black transition-all">دخول المتجر</a>
                            </div>
                        `;
                        container.innerHTML += cardHTML;
                    });
                } else {
                    container.innerHTML = '<div class="col-span-full text-center text-slate-500 font-bold py-10 bg-white rounded-2xl border border-slate-100">لا توجد شبكات مسجلة في المنصة حالياً.</div>';
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="col-span-full text-center text-rose-500 font-bold py-10 bg-white rounded-2xl border border-rose-100">❌ فشل الاتصال بالسيرفر.</div>';
            }
        }
        
        // تشغيل الدالة فور فتح لوحة العميل
        loadNetworks();

    </script>
</body>
</html>
